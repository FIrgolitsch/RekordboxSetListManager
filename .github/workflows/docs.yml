name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".readthedocs.yaml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build Sphinx docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      # pyrekordbox (autoapi) imports sqlcipher3 at module level
      - name: Install system libraries (SQLCipher)
        run: sudo apt-get update -qq && sudo apt-get install -y libsqlcipher-dev

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Cache venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: docs-venv-${{ hashFiles('uv.lock') }}
          restore-keys: docs-venv-

      - name: Sync docs dependencies
        run: uv sync --extra docs --frozen

      - name: Cache Sphinx doctrees
        uses: actions/cache@v5
        with:
          path: docs/_build/.doctrees
          key: sphinx-doctrees-${{ hashFiles('docs/conf.py', 'docs/index.rst', 'docs/api/index.rst') }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            sphinx-doctrees-${{ hashFiles('docs/conf.py', 'docs/index.rst', 'docs/api/index.rst') }}-
            sphinx-doctrees-

      - name: Build HTML docs (warnings-as-errors)
        run: >
          uv run --extra docs sphinx-build
          -b html
          -W --keep-going
          docs
          docs/_build/html

      - name: Upload HTML docs artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: html-docs
          path: docs/_build/html
          retention-days: 30
