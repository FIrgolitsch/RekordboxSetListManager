name: Wiki sync

on:
  push:
    branches: [main]
    paths:
      - "docs/*.md"

# Prevent two concurrent wiki pushes from racing
concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    name: "Sync docs → GitHub Wiki"
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # required to push to the wiki git repo

    steps:
      - uses: actions/checkout@v6.0.2

      # The GitHub wiki is a separate git repo at <repo>.wiki.git
      # NOTE: The wiki must be enabled and initialised (at least one page
      # created) in the repository settings before this workflow will succeed.
      - name: Clone wiki repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" \
            wiki

      - name: Copy markdown files into wiki
        run: |
          # overview.md becomes the wiki home page
          cp docs/overview.md wiki/Home.md

          # Copy every other docs/*.md verbatim
          for f in docs/*.md; do
            name="$(basename "$f")"
            if [ "$name" != "overview.md" ]; then
              cp "$f" "wiki/$name"
            fi
          done

      - name: Commit and push wiki changes
        run: |
          cd wiki
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          # Only push when something actually changed
          if ! git diff --cached --quiet; then
            git commit -m "docs: sync from main @ ${{ github.sha }}"
            git push
          else
            echo "No wiki changes — nothing to push."
          fi
